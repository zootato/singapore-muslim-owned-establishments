name: Scrape and deploy site

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 2 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python scraper.py --out data/establishments.json --max-pages 50
      - run: python tools/json_to_csv.py data/establishments.json data/establishments.csv
      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/establishments.json data/establishments.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update scraped establishments dataset (JSON + CSV)"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python scraper.py --out data/establishments.json --max-pages 50
      - run: python tools/json_to_csv.py data/establishments.json data/establishments.csv
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
